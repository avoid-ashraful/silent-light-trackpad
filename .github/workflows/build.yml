name: Build (macOS)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 16
        run: |
          for x in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app; do
            if [ -d "$x" ]; then sudo xcode-select -s "$x"; break; fi
          done
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
      - name: Run core tests
        run: swift test
      - name: Build app
        run: ./build-app.sh
      - name: Verify app architecture
        run: |
          file "dist/Silent Light Trackpad.app/Contents/MacOS/SilentLightTrackpad"
          lipo -archs "dist/Silent Light Trackpad.app/Contents/MacOS/SilentLightTrackpad"
      - name: Zip app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Silent Light Trackpad.app" "Silent-Light-Trackpad.zip"
          ls -lh
      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: Silent-Light-Trackpad-app
          path: dist/Silent-Light-Trackpad.zip
          if-no-files-found: error
      - name: Build debug variant (frame recording)
        run: FRAME_RECORDING=1 ./build-app.sh
      - name: Zip debug app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Silent Light Trackpad.app" "Silent-Light-Trackpad-Debug.zip"
          ls -lh
      - name: Upload debug app zip
        uses: actions/upload-artifact@v4
        with:
          name: Silent-Light-Trackpad-debug-app
          path: dist/Silent-Light-Trackpad-Debug.zip
          if-no-files-found: error
